name: BYTEFORGE story factory

on:
  workflow_dispatch:
    inputs:
      topic_index:
        description: "Story index (0-7)"
        required: false
        default: "0"
  schedule:
    - cron: "17 10,17 * * *"

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Locate project folder
        id: project
        run: |
          REQUIREMENTS=$(find . -type f -name requirements.txt -print -quit)
          test -n "$REQUIREMENTS" || { echo "requirements.txt not found"; exit 1; }
          PROJECT_DIR=$(dirname "$REQUIREMENTS")
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
        working-directory: ${{ steps.project.outputs.dir }}
      - name: Choose story for this run
        id: story
        env:
          TOPIC_INDEX: ${{ inputs.topic_index }}
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            index="${TOPIC_INDEX:-0}"
            case "$index" in
              ''|*[!0-9]*) echo "topic_index must be a non-negative integer"; exit 1 ;;
            esac
          else
            day=$(date -u +%j)
            hour=$(date -u +%H)
            if [ "$hour" -lt 14 ]; then slot=0; else slot=1; fi
            count=$(python -c "import json; print(len(json.load(open('scripts/topics.json', encoding='utf-8'))))")
            index=$(( (10#$day * 2 + slot) % count ))
          fi
          echo "index=$index" >> "$GITHUB_OUTPUT"
      - name: Render one story video
        env:
          BACKGROUND_URL: ${{ vars.BACKGROUND_URL }}
        run: python scripts/render.py --index "${{ steps.story.outputs.index }}"
        working-directory: ${{ steps.project.outputs.dir }}
      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: byteforge-story-video-${{ github.run_number }}
          path: ${{ steps.project.outputs.dir }}/output/*.mp4
          if-no-files-found: error
          retention-days: 14
      - name: Upload metadata and captions
        uses: actions/upload-artifact@v4
        with:
          name: byteforge-story-metadata-${{ github.run_number }}
          path: |
            ${{ steps.project.outputs.dir }}/output/*.json
            ${{ steps.project.outputs.dir }}/output/*.srt
          if-no-files-found: warn
          retention-days: 14
