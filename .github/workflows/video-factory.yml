name: BYTEFORGE story factory

on:
  workflow_dispatch:
    inputs:
      topic_index:
        description: "Starting story index"
        required: false
        default: "0"
  schedule:
    - cron: "17 10,17 * * *"

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Locate project folder
        id: project
        run: |
          REQUIREMENTS=$(find . -type f -name requirements.txt -print -quit)
          test -n "$REQUIREMENTS" || { echo "requirements.txt not found"; exit 1; }
          PROJECT_DIR=$(dirname "$REQUIREMENTS")
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
        working-directory: ${{ steps.project.outputs.dir }}
      - name: Render two stories
        env:
          BACKGROUND_URL: ${{ vars.BACKGROUND_URL }}
        run: python scripts/render.py --index "${{ inputs.topic_index || '0' }}" --batch 2
        working-directory: ${{ steps.project.outputs.dir }}
      - name: Upload videos
        uses: actions/upload-artifact@v4
        with:
          name: byteforge-story-videos-${{ github.run_number }}
          path: ${{ steps.project.outputs.dir }}/output/*.mp4
          if-no-files-found: error
          retention-days: 14
      - name: Upload metadata and captions
        uses: actions/upload-artifact@v4
        with:
          name: byteforge-story-metadata-${{ github.run_number }}
          path: |
            ${{ steps.project.outputs.dir }}/output/*.json
            ${{ steps.project.outputs.dir }}/output/*.srt
          if-no-files-found: warn
          retention-days: 14
